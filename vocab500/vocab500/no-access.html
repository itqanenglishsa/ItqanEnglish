<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوصول غير مصرح به | إتقان English</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }
        .card {
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .card img {
            width: 140px;
            height: auto;
            margin-bottom: 20px;
            border-radius: 12px;
        }
        .card h2 {
            color: #ef4444;
            margin-top: 0;
            margin-bottom: 12px;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .card p {
            color: #475569;
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn-home {
            display: inline-block;
            width: 100%;
            padding: 12px 20px;
            background-color: #214ecf;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            transition: background-color 0.2s ease;
        }
        .btn-home:hover {
            background-color: #1a3eb0;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الصورة الخاصة بالتنبيه -->
        <img src="forfun.PNG" alt="Access Denied" onerror="this.style.display='none'">

        <!-- عنوان الرسالة -->
        <h2>عذراً، الوصول غير مصرح به! 🛑</h2>

        <!-- نص التنبيه -->
        <p>يجب عليك تسجيل الدخول والاشتراك في كورس الفوكاب أولاً لتتمكن من تصفح المحتوى.</p>

        <!-- زر الانتقال للرئيسية -->
        <a href="https://itqanenglishsa.github.io/ItqanEnglish/" class="btn-home">
            الانتقال للصفحة الرئيسية
        </a>
    </div>

</body>
</html>
