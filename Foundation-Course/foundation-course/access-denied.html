<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الوصول غير مصرح به</title>

<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Almarai",sans-serif;
    background:#f8fafc;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

.container{
    width:100%;
    max-width:520px;
    text-align:center;
}

.image{
    width:180px;
    max-width:80%;
    margin:0 auto 28px;
    display:block;
}

h1{
    color:#ef4444;
    font-size:2rem;
    font-weight:800;
    line-height:1.6;
    margin-bottom:18px;
}

p{
    color:#64748b;
    font-size:1.2rem;
    line-height:2;
    margin-bottom:42px;
}

.button{
    display:inline-flex;
    justify-content:center;
    align-items:center;
    width:100%;
    max-width:420px;
    height:60px;

    background:#1d4ed8;
    color:#fff;

    text-decoration:none;

    border-radius:14px;

    font-size:1.25rem;
    font-weight:700;

    transition:.25s;
}

.button:hover{
    background:#1e40af;
    transform:translateY(-2px);
}

.button:active{
    transform:scale(.98);
}

@media (max-width:600px){

.image{
    width:150px;
}

h1{
    font-size:1.8rem;
}

p{
    font-size:1.1rem;
}

.button{
    height:56px;
    font-size:1.15rem;
}

}
</style>

</head>

<body>

<div class="container">

<img src="forfun.PNG" alt="Access Denied" class="image">

<h1>
عذراً، والله ما تمشي لو أبوك اللواء! 🛑
</h1>

<p>
يجب عليك تسجيل الدخول والاشتراك في الكورس أولاً لتتمكن من تصفح المحتوى.
</p>

<a class="button"
href="https://itqanenglishsa.github.io/ItqanEnglish/">
الانتقال لصفحة تسجيل الدخول
</a>

</div>

</body>
</html>
